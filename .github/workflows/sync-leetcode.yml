name: Sync Leetcode
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */1 * *" # Runs once a day

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Sync all LeetCode submissions (accepted + unsuccessful)
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          DESTINATION_FOLDER: "Solutions"
        run: python sync_leetcode.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Solutions"
          if git diff --cached --quiet; then
            echo "No new submissions to commit."
          else
            git commit -m "Sync LeetCode submissions (accepted + unsuccessful)"
            git push
          fi
